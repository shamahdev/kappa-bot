# Kappa monorepo — nginx site snippet (single origin).
#
#   https://kappa.shamah.dev/api/  → service API (:3443)
#   https://kappa.shamah.dev/      → web dashboard (:3444)
#
# Single origin means the Lax session cookie needs no Domain attribute and the
# service needs no CORS (the browser calls /api on the same host it loaded).
#
# Install (Debian/Ubuntu):
#   sudo cp nginx.conf /etc/nginx/sites-available/kappa
#   sudo ln -s /etc/nginx/sites-available/kappa /etc/nginx/sites-enabled/kappa
#   sudo nginx -t && sudo systemctl reload nginx
# (RHEL-likes: copy to /etc/nginx/conf.d/kappa.conf instead.)
#
# HTTPS is REQUIRED in prod: the service sets Secure session cookies when
# NODE_ENV=production, so login breaks over plain HTTP. Easiest path:
#   sudo certbot --nginx -d kappa.shamah.dev

upstream kappa_service { server 127.0.0.1:3443; }
upstream kappa_web { server 127.0.0.1:3444; }

server {
  listen 80;
  server_name kappa.shamah.dev; # certbot adds the 443 block

  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://kappa_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://kappa_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
