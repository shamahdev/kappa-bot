# Kappa monorepo — nginx site snippet (single origin for service + web).
#
# Install (Debian/Ubuntu):
#   sudo cp nginx.conf /etc/nginx/sites-available/kappa
#   sudo sed -i 's/kappa.example.com/<your-domain>/' /etc/nginx/sites-available/kappa
#   sudo ln -s /etc/nginx/sites-available/kappa /etc/nginx/sites-enabled/kappa
#   sudo nginx -t && sudo systemctl reload nginx
# (RHEL-likes: copy to /etc/nginx/conf.d/kappa.conf instead.)
#
# HTTPS is REQUIRED in prod: the service sets Secure session cookies when
# NODE_ENV=production, so login breaks over plain HTTP. Easiest path:
#   sudo certbot --nginx -d <your-domain>
# then all https:// traffic below keeps working unchanged.

upstream kappa_service { server 127.0.0.1:3001; }
upstream kappa_web { server 127.0.0.1:3000; }

server {
  listen 80;
  server_name kappa.example.com; # <-- CHANGE ME (certbot adds the 443 block)

  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://kappa_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://kappa_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
